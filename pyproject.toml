[project]
name = "chromatica"
version = "0.0.0"
description = "Research tools for image colorization and physical Lab color analysis"
authors = [
    { name = "Mikhail Polevoda", email = "snail1704@gmail.com" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

requires-python = "~=3.12.0"
dependencies = [
    "numpy>=2.2.6",
    "pillow>=11.2.1",
    "scikit-image>=0.25.2",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
]

[project.optional-dependencies]
clearml = ["clearml>=1.18.0"]
visualization = ["matplotlib>=3.10.3"]
cpu = [
    "torch==2.7.0; sys_platform == 'linux'",
    "torchvision==0.22.0; sys_platform == 'linux'",
]
cuda = [
    "torch==2.7.0; sys_platform == 'linux'",
    "torchvision==0.22.0; sys_platform == 'linux'",
]

[project.urls]
Repository = "https://github.com/snailUlitka/chromatica"

[project.scripts]
chromatica-train = "chromatica.training.experiment:main"
chromatica-evaluate = "chromatica.evaluation.experiment:main"
chromatica-compare = "chromatica.evaluation.comparison:main"
chromatica-smoke = "chromatica.training.smoke:main"
chromatica-run-all = "chromatica.training.suite:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"
force-exclude = true

exclude = [
    ".git",
    ".git-rewrite",
    ".jj",
    ".ipynb_checkpoints",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    ".vscode",
    "__pypackages__",
    "build",
    "site-packages",
    "reports",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN",
  "G004",
  "D401",
  "RET504",
  "ISC001",
  "TD002",
  "FIX",
  "COM812",
  "CPY001", # The repository license covers the source files.
]
task-tags = ["HACK", "FIXME", "TODO"]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201", "S603"]
"notebooks/*" = ["T201", "B018", "D", "BLE001", "PLR0913", "PTH105", "C901", "PLW2901", "E501", "I001"]
"tests/*" = ["S101", "PLR2004"]
"src/chromatica/training/experiment.py" = ["T201", "PLC0415"]
"src/chromatica/training/smoke.py" = ["T201"]
"src/chromatica/training/suite.py" = ["T201"]
"src/chromatica/training/data.py" = ["PLC0415"]
"src/chromatica/integrations/clearml.py" = ["PLC0415"]
"src/chromatica/nn/*/cnn.py" = ["N814"] # Preserve the historical CNN import.

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.3.4",
    "ruff==0.16.5",
]
notebook = [
    "ipywidgets>=8.1.7",
    "jupyterlab>=4.4.2",
    "matplotlib>=3.10.3",
]

[tool.uv]
default-groups = ["dev"]
exclude-newer = "2026-10-01T00:00:00Z"
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu126", extra = "cuda", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu126", extra = "cuda", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pyright]
venvPath = "."
venv = ".venv"
exclude = [".venv"]
pythonVersion = "3.12"
