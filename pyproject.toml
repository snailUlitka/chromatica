[project]
name = "chromatica"
version = "0.0.0"
description = "Chromatica is CNN for colorization photos"
authors = [
    { name = "Mikhail Polevoda", email = "snail1704@gmail.com" }
]
readme = "README.md"

requires-python = "~=3.12"
dependencies = [
    "clearml>=1.18.0",
    "fastapi[standard]>=0.115.12",
    "numpy>=2.2.6",
    "pydantic>=2.11.4",
    "scikit-image>=0.25.2",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "tqdm>=4.67.1",
]

[project.scripts]
dataset_create = "chromatica.cli.dataset:create"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN",
  "G004",
  "D401",
  "RET504",
  "ISC001",
  "S101",
  "TD002",
  "FIX",
  "COM812",
]
task-tags = ["HACK", "FIXME", "TODO"]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
exclude = [".venv"]
