services:
  api:
    image: chromatica-api:prod
    command: ["api"]
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: postgresql://chromatica:chromatica@db:5432/chromatica
      DATASETS_PATH: /app/.data
      MODEL_STORE_PATH: /app/.models
    ports:
      - "8000:8000"
    volumes:
      - ./.data:/app/.data
      - ./.models:/app/.models
    depends_on:
      db:
        condition: service_healthy

  ui:
    image: chromatica-ui:prod
    environment:
      BASE_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chromatica
      POSTGRES_PASSWORD: chromatica
      POSTGRES_DB: chromatica
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chromatica"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
