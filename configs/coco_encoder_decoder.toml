# Matched protocol template; unexecuted and not tuned to measured results.
architecture = "encoder_decoder"
seed = 42
device = "cpu"
deterministic = true
output_dir = ".runs/coco_encoder_decoder"

[data]
name = "coco"
train_dir = ".data/coco/train"
test_dir = ".data/coco/test"
image_size = 256
batch_size = 8
num_workers = 0
val_fraction = 0.2
recursive = true

[training]
epochs = 3
learning_rate = 0.0001
weight_decay = 0.0
use_amp = false

[evaluation]
hue_bins = 360
min_chroma = 8.0
median_bins = 4096
delta_a_min = -255.0
delta_a_max = 255.0

[tracking]
enabled = false
project = "Chromatica"
